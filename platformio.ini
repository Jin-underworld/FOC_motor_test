[env:disco_f407vg]
platform = ststm32
board = disco_f407vg
board_build.mcu = stm32f407vgt6
board_build.f_cpu = 168000000L
framework = arduino
;upload_protocol = stlink
monitor_speed = 115200
lib_archive = false

lib_deps = 
	;dfrobot/DFRobot_I2C_Multiplexer@^1.0.2
	;stm32duino/STM32duino FreeRTOS@^10.3.3
	askuric/Simple FOC@^2.3.5

build_flags =
	-DSIMPLEFOC_STM32_MAX_PINTIMERSUSED=30
	-DSIMPLEFOC_STM32_MAX_MOTORSUSED=6


